  if(r){var b=$("#fe");b.textContent=r;b.focus();return}
  await api.load();toast(OK[k]||"Tersimpan.");render("#h")
 }catch(x){toast("Terjadi kesalahan. Muat ulang halaman lalu coba lagi.")}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;var b=$("#bt");if(b)b.innerHTML=barangTable()}});
document.addEventListener("change",async function(e){
 var t=e.target;if(!S.user)return;
 if(t.id==="per"){S.per=Number(t.value);return render("#per")}
 if(t.dataset&&t.dataset.role&&is("admin")){
  var r=await sb.from("profiles").update({role:t.value}).eq("id",t.dataset.role);
  if(r.error)toast(er(r.error));else{log("Ubah peran pengguna menjadi "+t.value);await api.load();toast("Peran diperbarui.")}
  render('[data-role="'+t.dataset.role+'"]')}
});
document.addEventListener("click",async function(e){
 var b=e.target.closest("[data-a]");if(!b)return;S.last=Date.now();
 var a=b.dataset.a,id=Number(b.dataset.id);
 if(a==="fs"){pref.fs=Math.min(160,Math.max(85,pref.fs+Number(b.dataset.v)));return applyPref()}
 if(a==="hc"){pref.hc=pref.hc?0:1;applyPref();document.querySelectorAll('[data-a="hc"]').forEach(function(x){x.setAttribute("aria-pressed",pref.hc?"true":"false")});return}
 if(a==="login")return viewLogin();
 if(a==="home")return viewHome();
 if(a==="out")return logout();
 if(!S.user)return;
 try{
 if(a==="sb"){S.sbc=!S.sbc;applyPref();var t=$('[data-a="sb"][aria-expanded]');if(t){t.setAttribute("aria-expanded",S.sbc?"false":"true");t.focus()}return}
 if(a==="nav"){if(can(b.dataset.p)){S.page=b.dataset.p;S.edit=null;S.pend=null;S.q="";if(window.innerWidth<800)S.sbc=true;render("#h")}return}
 if(a==="cancel"){S.edit=null;S.pend=null;return render("#h")}
 if(a==="edit"&&is("admin","gudang")){S.edit=id;return render("#sku")}
 if(a==="del"&&is("admin")){var it=item(id);if(!it)return;if(!confirm("Hapus barang "+it.name+"?"))return;var rd=await sb.from("items").delete().eq("id",id);if(rd.error)return toast(rd.error.code==="23503"?"Barang punya riwayat transaksi, tidak bisa dihapus.":er(rd.error));log("Hapus barang "+it.sku);await api.load();return render("#h")}
 if(a==="vfy"&&is("admin","manajer")){S.pend=id;return render("#fisik")}
 if(a==="shp"){var rs=await sb.rpc("advance_ship",{p_id:id});if(rs.error)return toast(rs.error.message);log("Pengiriman #"+id+" menjadi "+rs.data);await api.load();return render("#h")}
 if(a==="tgl"&&is("admin")){var u=db.users.find(function(x){return x.id===b.dataset.id});if(!u||u.id===S.user.id)return;var ru=await sb.from("profiles").update({aktif:!u.on}).eq("id",u.id);if(ru.error)return toast(er(ru.error));log((u.on?"Nonaktifkan ":"Aktifkan ")+u.user);await api.load();return render("#h")}
 if(a==="print"&&can("laporan"))return window.print();
 if(a==="csv"&&can("laporan")){var r=repData(),L=[["Kode","Barang","Kategori","Stok","Minimum","Masuk","Keluar"]];
  db.items.forEach(function(i){L.push([i.sku,i.name,i.cat,i.stock,i.min,r.m[i.id]||0,r.k[i.id]||0])});
  dl("laporan-retailku-"+new Date().toISOString().slice(0,10)+".csv","\ufeff"+L.map(function(x){return x.map(csvCell).join(",")}).join("\r\n"),"text/csv;charset=utf-8");log("Unduh laporan CSV");return toast("Laporan diunduh. Jika tidak terunduh, buka RetailKu di tab sendiri.")}
 if(a==="exp"&&is("admin")){await api.load();dl("retailku-cadangan-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(db,null,1),"application/json");log("Unduh cadangan");return toast("Cadangan diunduh. Jika tidak terunduh, buka RetailKu di tab sendiri.")}
 }catch(x){toast("Terjadi kesalahan. Muat ulang halaman lalu coba lagi.")}
});
document.addEventListener("keydown",function(e){S.last=Date.now();if(e.key==="Escape"&&S.v==="app"&&window.innerWidth<800&&!S.sbc){S.sbc=true;applyPref();var t=$('[data-a="sb"][aria-expanded]');if(t){t.setAttribute("aria-expanded","false");t.focus()}}});
setInterval(function(){if(S.user&&Date.now()-S.last>15*60*1000)logout("Sesi berakhir karena tidak aktif 15 menit. Silakan masuk lagi.")},30000);

try{if(window.supabase&&/^https:\/\/[a-z0-9-]+\.supabase\.co/.test(SUPABASE_URL)&&SUPABASE_KEY.length>40){sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);sb2=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"rk-tmp"}});sb.auth.signOut()}}catch(e){sb=null}
setInterval(async function(){
 if(!S.user||S.v!=="app"||!sb)return;
 var ae=document.activeElement,tg=ae&&ae.tagName;if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA"||S.edit||S.pend)return;
 try{await api.load();var me=db.users.find(function(u){return u.id===S.user.id});if(!me||!me.on||me.role==="none")return logout("Akses Anda diubah oleh Admin. Silakan masuk lagi.");S.user=me;var y=window.scrollY;render();window.scrollTo(0,y)}catch(e){}
},20000);
applyPref();viewHome();
})();
</script>
</body>
</html>
